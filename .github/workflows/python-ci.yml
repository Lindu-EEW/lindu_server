name: Python Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt flake8

    - name: Syntax & Indentation Check
      run: |
        echo "Menguji semua file Python dari SyntaxError dan IndentationError..."
        python -m py_compile consensus.py test_consensus.py simulate_and_compare_events.py simulate_e2e.py

    - name: Logical Error Check (Undefined variables, Missing imports)
      run: |
        # Hanya mengecek error fatal (F), mengabaikan style (E/W)
        flake8 consensus.py test_consensus.py simulate_and_compare_events.py simulate_e2e.py --select=F401,F821,E9,F63,F7,F82 --show-source --statistics

    - name: Run Unit Tests
      run: |
        python -m unittest test_consensus.py
