name: Python Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Syntax & Indentation Check
      run: |
        echo "Menguji consensus.py dari SyntaxError dan IndentationError..."
        python -m py_compile consensus.py
        
    - name: Install Flake8
      run: pip install flake8
      
    - name: Logical Error Check (Undefined variables, Missing imports)
      run: |
        # Hanya mengecek error fatal (F), mengabaikan style (E/W)
        flake8 consensus.py --select=F401,F821,E9,F63,F7,F82 --show-source --statistics
